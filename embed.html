<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<style>
    html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background-color: transparent;
        overflow: hidden;
    }
    iframe {
        width: 100%;
        height: 100%;
        border: none;
        display: block;
    }
</style>
</head>
<body>

<!-- The actual video iframe gets built by the script below, using
     whatever video ID is passed in the page's own URL, e.g.:
     embed.html?v=LwnqifDJCXM
     This means you only ever host this ONE file — every prayer video
     just points here with a different ?v= value. -->
<div id="player-container"></div>

<script>
    function getVideoID() {
        const params = new URLSearchParams(window.location.search);
        return params.get('v');
    }

    const videoID = getVideoID();

    if (videoID) {
        const iframe = document.createElement('iframe');
        iframe.src = "https://www.youtube-nocookie.com/embed/" + videoID;
        iframe.setAttribute('frameborder', '0');
        iframe.setAttribute('allow', 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share');
        iframe.setAttribute('allowfullscreen', '');
        document.getElementById('player-container').appendChild(iframe);
    } else {
        document.body.innerText = "No video ID provided.";
    }
</script>

</body>
</html>
