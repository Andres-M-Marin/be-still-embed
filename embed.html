<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<style>
    html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background-color: transparent;
        overflow: hidden;
    }
    iframe {
        width: 100%;
        height: 100%;
        border: none;
        display: block;
    }
</style>
</head>
<body>

<!-- The actual video iframe gets built by the script below, using
     whatever is passed in the page's own URL:
     - embed.html?v=VIDEO_ID       for a single video
     - embed.html?list=PLAYLIST_ID for a playlist (plays whatever is
       first in that playlist's current sort order)
     This means you only ever host this ONE file — every prayer just
     points here with a different ?v= or ?list= value. -->
<div id="player-container"></div>

<script>
    function getParam(name) {
        const params = new URLSearchParams(window.location.search);
        return params.get(name);
    }

    let videoID = getParam('v');
    const playlistID = getParam('list');

    let embedSrc = null;
    if (videoID) {
        embedSrc = "https://www.youtube-nocookie.com/embed/" + videoID + "?autoplay=1";
    } else if (playlistID) {
        embedSrc = "https://www.youtube-nocookie.com/embed/videoseries?list=" + playlistID + "&autoplay=1";
    }

    if (embedSrc) {
        const iframe = document.createElement('iframe');
        iframe.src = embedSrc;
        iframe.setAttribute('frameborder', '0');
        iframe.setAttribute('allow', 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share');
        iframe.setAttribute('allowfullscreen', '');
        document.getElementById('player-container').appendChild(iframe);
    } else {
        document.body.innerText = "No video or playlist ID provided.";
    }
</script>

</body>
</html>
